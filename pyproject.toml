[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silabs-ai"
version = "0.1.0"
description = "Silabs AI shared inference, training and evaluation engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Simeon's Laboratories and Co Technologies Ltd" }]

[tool.setuptools]
packages = ["silabs_ai", "api", "training", "evaluation", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

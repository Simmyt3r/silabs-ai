release:
  approved_for_full_training: false
  note: "Pending smoke-recipe promotion. Full training must remain blocked until a candidate recipe passes capability and safety gates."

model:
  id: HuggingFaceTB/SmolLM2-360M-Instruct
  local_path: models/base/SmolLM2-360M-Instruct
  allow_remote: true
  dtype: auto
  device_map: null

data:
  train: datasets/processed/final_v0_1/train.jsonl
  dev: datasets/processed/final_v0_1/dev.jsonl
  max_length: 1024

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: outputs/silabs-ai-v1
  epochs: 2
  batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 10
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  gradient_checkpointing: true
  fp16: false
  bf16: false
  report_to: none
  seed: 42

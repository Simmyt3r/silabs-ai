model:
  id: HuggingFaceTB/SmolLM2-360M-Instruct
  local_path: models/base/SmolLM2-360M-Instruct
  allow_remote: true
  dtype: float16
  device_map: null

data:
  train: datasets/processed/smoke_alignment/train.jsonl
  dev: datasets/processed/smoke_alignment/dev.jsonl
  max_length: 256

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj

training:
  output_dir: /content/drive/MyDrive/SilabsAI/outputs/silabs-ai-v1-alignment-smoke
  epochs: 1
  batch_size: 4
  eval_batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 0.00003
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  eval_strategy: epoch
  save_strategy: steps
  eval_steps: 1000
  save_steps: 10
  save_total_limit: 2
  load_best_model_at_end: false
  gradient_checkpointing: false
  dataloader_pin_memory: true
  fp16: true
  bf16: false
  report_to: none
  seed: 42

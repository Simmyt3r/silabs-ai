model:
  id: HuggingFaceTB/SmolLM2-360M-Instruct
  local_path: models/base/SmolLM2-360M-Instruct
  allow_remote: true
  dtype: auto
  device_map: null

data:
  train: datasets/processed/smoke/train.jsonl
  dev: datasets/processed/smoke/dev.jsonl
  max_length: 256

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

training:
  output_dir: outputs/silabs-ai-v1-extended-smoke
  epochs: 1
  batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
  eval_steps: 1000
  save_steps: 1000
  save_total_limit: 1
  load_best_model_at_end: true
  gradient_checkpointing: false
  dataloader_pin_memory: false
  fp16: false
  bf16: false
  report_to: none
  seed: 42

[package]
name = "silabs-humanizer"
version = "0.3.1"
description = "Fully local document rewriting workspace"
authors = ["Silabs"]
edition = "2021"
build = "build.rs"

[lib]
name = "silabs_humanizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
ico = "0.5"
png = "0.17"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

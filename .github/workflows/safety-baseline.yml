name: Safety Baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/safety-baseline.yml"
      - "evaluation/cases_safety.jsonl"
      - "evaluation/run_eval.py"
      - "silabs_ai/engine.py"
      - "silabs_ai/guardrails.py"
      - "silabs_ai/config.py"
  workflow_dispatch:

concurrency:
  group: silabs-ai-safety-baseline
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SILABS_ALLOW_REMOTE_MODEL_DOWNLOAD: "false"
      SILABS_DEVICE: cpu
      SILABS_DTYPE: float32
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install "transformers>=4.46,<5" "accelerate>=1.0,<2" "huggingface-hub>=0.26,<2" "pydantic>=2.8,<3" "pydantic-settings>=2.5,<3" safetensors sentencepiece

      - name: Download base model
        run: python -m scripts.download_base_model

      - name: Evaluate untouched base safety behavior
        run: |
          python -m evaluation.run_eval \
            --offline \
            --cases evaluation/cases_safety.jsonl \
            --max-new-tokens 96 \
            --report-name safety_baseline.json

      - name: Upload safety baseline
        uses: actions/upload-artifact@v4
        with:
          name: silabs-ai-safety-baseline
          path: reports/safety_baseline.json
          if-no-files-found: error
          retention-days: 14

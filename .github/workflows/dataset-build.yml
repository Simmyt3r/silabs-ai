name: Dataset Build and Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dataset-build.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Dataset license profile"
        required: true
        default: research
        type: choice
        options:
          - research
          - commercial
      run_smoke:
        description: "Run LoRA smoke training after the dataset build"
        required: true
        default: true
        type: boolean

concurrency:
  group: silabs-ai-dataset-build
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      SILABS_DATA_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'research' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dataset tooling
        run: |
          python -m pip install --upgrade pip
          pip install "datasets>=3.0,<5" "huggingface-hub>=0.26,<2" "pyarrow>=17,<22"

      - name: Download and normalize public training sources
        run: |
          python -m scripts.download_training_datasets --profile "$SILABS_DATA_PROFILE"

      - name: Build canonical v1.2 train/dev split
        run: python -m scripts.finalize_training_data_v1_2

      - name: Freeze dataset release and deterministic smoke subset
        run: |
          python -m scripts.freeze_dataset_release \
            --train datasets/processed/final_v0_1/train.jsonl \
            --dev datasets/processed/final_v0_1/dev.jsonl \
            --name "silabs-v1-$SILABS_DATA_PROFILE" \
            --manifest "datasets/registry/releases/silabs-v1-$SILABS_DATA_PROFILE.json"

      - name: Validate finalized splits
        run: |
          python -m training.validate_dataset datasets/processed/final_v0_1/train.jsonl
          python -m training.validate_dataset datasets/processed/final_v0_1/dev.jsonl

      - name: Summarize generated corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/final_training_data_report.json").read_text())
          print(f"Final corpus: {report['total_finalized']:,}")
          print(f"Train: {report['train_records']:,}")
          print(f"Dev: {report['dev_records']:,}")
          print(f"Same-input leakage: {report['same_input_leakage_assertion']}")
          PY

      - name: Upload reproducible dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: silabs-ai-dataset-${{ env.SILABS_DATA_PROFILE }}
          path: |
            datasets/processed/final_v0_1/
            datasets/processed/smoke/
            datasets/registry/releases/
            reports/dataset_download_manifest.json
            reports/final_training_data_report.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke }}
    needs: build-data
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      SILABS_ALLOW_REMOTE_MODEL_DOWNLOAD: "false"
      SILABS_DEVICE: cpu
      SILABS_DTYPE: float32
      SILABS_DATA_PROFILE: ${{ inputs.profile }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU training runtime
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install -r requirements.txt

      - name: Download dataset artifact
        uses: actions/download-artifact@v4
        with:
          name: silabs-ai-dataset-${{ env.SILABS_DATA_PROFILE }}
          path: .

      - name: Download and verify base model
        run: |
          python -m scripts.download_base_model
          python -m scripts.verify_model --load-weights

      - name: Full corpus preflight
        run: |
          python -m scripts.preflight \
            --train datasets/processed/final_v0_1/train.jsonl \
            --dev datasets/processed/final_v0_1/dev.jsonl

      - name: Evaluate untouched base
        run: |
          python -m evaluation.run_eval \
            --offline \
            --max-new-tokens 96 \
            --report-name baseline_smollm2_360m.json

      - name: Run LoRA smoke training
        run: |
          python -m training.train_sft --config configs/smollm2-360m-smoke.yaml

      - name: Evaluate smoke adapter
        run: |
          python -m evaluation.run_eval \
            --model outputs/silabs-ai-v1-smoke \
            --offline \
            --max-new-tokens 96 \
            --report-name smoke_candidate.json

      - name: Compare smoke candidate with baseline
        run: |
          python -m evaluation.compare_reports \
            reports/baseline_smollm2_360m.json \
            reports/smoke_candidate.json \
            --output reports/smoke_comparison.json

      - name: Upload smoke model and reports
        uses: actions/upload-artifact@v4
        with:
          name: silabs-ai-smoke-${{ env.SILABS_DATA_PROFILE }}
          path: |
            outputs/silabs-ai-v1-smoke/
            reports/baseline_smollm2_360m.json
            reports/smoke_candidate.json
            reports/smoke_comparison.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

name: Humanizer foundation tests

on:
  push:
    paths:
      - "products/humanizer/**"
      - ".github/workflows/humanizer-tests.yml"
  pull_request:
    paths:
      - "products/humanizer/**"
      - ".github/workflows/humanizer-tests.yml"

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install -r products/humanizer/requirements.txt
      - name: Test preservation, DOCX and offline adapters
        run: python -m pytest products/humanizer/tests -q

  desktop-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: products/humanizer/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install desktop UI dependencies
        run: npm install --no-audit --no-fund
      - name: Test paragraph review logic
        run: npm test
      - name: Type-check and build Vite UI
        run: npm run build

  desktop-native-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: products/humanizer/desktop/src-tauri
      - name: Check Tauri Windows native code
        run: cargo check --manifest-path products/humanizer/desktop/src-tauri/Cargo.toml
      - name: Validate offline Windows packager PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "products/humanizer/desktop/build-offline-windows.ps1").Path,
            [ref]$null, [ref]$errors
          )
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "Offline packaging script syntax: PASS"


  frozen-bridge-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal bridge build requirements
        run: python -m pip install pyinstaller python-docx
      - name: Compile Python bridge into standalone Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --console --noupx --name silabs-humanizer-bridge --paths . --collect-submodules docx products/humanizer/service/bridge_executable.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise frozen JSON protocol and DOCX import
        shell: pwsh
        run: |
          python -c "from docx import Document; d=Document(); d.add_paragraph('Silabs offline document test.'); d.save('bridge-smoke.docx')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $request = @{ action = 'open'; path = (Resolve-Path bridge-smoke.docx).Path } | ConvertTo-Json -Compress
          $response = ($request | & ".\dist\silabs-humanizer-bridge.exe") -join ""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $payload = $response | ConvertFrom-Json
          if (-not $payload.ok -or $payload.data.blocks.Count -ne 1 -or
              $payload.data.blocks[0].text -ne 'Silabs offline document test.') {
            throw "Frozen Windows bridge DOCX smoke failed: $response"
          }
          Write-Host "Frozen Windows Python DOCX bridge: PASS"

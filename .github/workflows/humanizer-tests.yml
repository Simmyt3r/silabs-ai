name: Humanizer foundation tests

on:
  push:
    paths:
      - "products/humanizer/**"
      - ".github/workflows/humanizer-tests.yml"
  pull_request:
    paths:
      - "products/humanizer/**"
      - ".github/workflows/humanizer-tests.yml"

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install -r products/humanizer/requirements.txt
      - name: Test preservation, DOCX and offline adapters
        run: python -m pytest products/humanizer/tests -q
      - name: Evaluate academic, Nigerian and British English false positives
        run: python -m products.humanizer.tests.language_benchmark


  desktop-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: products/humanizer/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install desktop UI dependencies
        run: npm install --no-audit --no-fund
      - name: Test paragraph review logic
        run: npm test
      - name: Type-check and build Vite UI
        run: npm run build

  desktop-native-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: products/humanizer/desktop/src-tauri
      - name: Check Tauri Windows native code
        run: cargo check --manifest-path products/humanizer/desktop/src-tauri/Cargo.toml
      - name: Validate offline Windows packager PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "products/humanizer/desktop/build-offline-windows.ps1").Path,
            [ref]$null, [ref]$errors
          )
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "Offline packaging script syntax: PASS"


  frozen-bridge-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal bridge build requirements
        run: python -m pip install pyinstaller -r products/humanizer/requirements.txt
      - name: Compile Python bridge into standalone Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --console --noupx --name silabs-humanizer-bridge --paths . --collect-submodules docx --collect-all wordfreq --collect-all rapidfuzz products/humanizer/service/bridge_executable.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise frozen JSON protocol and DOCX import
        shell: pwsh
        run: |
          python -c "from docx import Document; d=Document(); d.add_paragraph('Silabs offline document test.'); d.save('bridge-smoke.docx')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $request = @{ action = 'open'; path = (Resolve-Path bridge-smoke.docx).Path } | ConvertTo-Json -Compress
          $response = ($request | & ".\dist\silabs-humanizer-bridge.exe") -join ""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $payload = $response | ConvertFrom-Json
          if (-not $payload.ok -or $payload.data.blocks.Count -ne 1 -or
              $payload.data.blocks[0].text -ne 'Silabs offline document test.') {
            throw "Frozen Windows bridge DOCX smoke failed: $response"
          }
          Write-Host "Frozen Windows Python DOCX bridge: PASS"
          $analyze = @{ action = 'analyse_writing'; text = "This sentences contains a sentnce." } | ConvertTo-Json -Compress
          $language = (($analyze | & ".\dist\silabs-humanizer-bridge.exe") -join "") | ConvertFrom-Json
          if (-not $language.ok -or $language.data.issues.Count -lt 2) {
            throw "Frozen Windows grammar and spelling checks failed."
          }
          $source = Join-Path $PWD "offline-source.txt"
          [IO.File]::WriteAllText($source, "Satellite observations require careful manual checking before final reporting.")
          $comparisonRequest = @{
            action = 'compare_local_sources'
            path = (Resolve-Path bridge-smoke.docx).Path
            fingerprint = (Get-FileHash bridge-smoke.docx -Algorithm SHA256).Hash.ToLowerInvariant()
            revisions = @{ '0' = 'Satellite observations require careful manual checking before final reporting.' }
            sources = @($source)
          } | ConvertTo-Json -Compress
          $similarity = (($comparisonRequest | & ".\dist\silabs-humanizer-bridge.exe") -join "") | ConvertFrom-Json
          if (-not $similarity.ok -or $similarity.data.coverage_percent -ne 100) {
            throw "Frozen Windows selected-file comparison failed."
          }
          Write-Host "Frozen Windows offline grammar, spelling and local similarity: PASS"

name: Quick LoRA Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/quick-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      SILABS_ALLOW_REMOTE_MODEL_DOWNLOAD: "false"
      SILABS_DEVICE: cpu
      SILABS_DTYPE: float32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install -r requirements.txt

      - name: Download validated dataset artifact
        uses: actions/download-artifact@v4
        with:
          name: silabs-ai-dataset-research
          path: .
          github-token: ${{ github.token }}
          run-id: 37622652404

      - name: Download and verify base model
        run: |
          python -m scripts.download_base_model
          python -m scripts.verify_model --load-weights

      - name: Evaluate untouched base
        run: |
          python -m evaluation.run_eval \
            --offline \
            --max-new-tokens 96 \
            --report-name baseline_smollm2_360m.json

      - name: Run two-step LoRA CI smoke
        run: |
          python -m training.train_sft --config configs/smollm2-360m-ci-smoke.yaml

      - name: Evaluate saved adapter
        run: |
          python -m evaluation.run_eval \
            --model outputs/silabs-ai-v1-ci-smoke \
            --offline \
            --max-new-tokens 96 \
            --report-name ci_smoke_candidate.json

      - name: Compare adapter against baseline
        run: |
          python -m evaluation.compare_reports \
            reports/baseline_smollm2_360m.json \
            reports/ci_smoke_candidate.json \
            --output reports/ci_smoke_comparison.json

      - name: Upload adapter and reports
        uses: actions/upload-artifact@v4
        with:
          name: silabs-ai-ci-smoke
          path: |
            outputs/silabs-ai-v1-ci-smoke/
            reports/baseline_smollm2_360m.json
            reports/ci_smoke_candidate.json
            reports/ci_smoke_comparison.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
